name: riskship
version: 0.1.0
description: "Detección de anomalías con alertas a Linear"
hermes_requires: ">=0.15.0"
author: "Aristotekean"
license: "MIT"

env_requires:
  - name: FIREWORKS_API_KEY
    description: "API key de Fireworks AI"
    required: true
  - name: NEON_READONLY_URL
    description: "Postgres de Neon, credencial de solo lectura (reservada para los cron de detección)"
    required: false
    default: ""
  - name: LINEAR_API_KEY
    description: "Token de Linear con permiso de escritura"
    required: true
  - name: LINEAR_TEAM_KEY
    description: "Clave del equipo de Linear donde se crean los issues (ej. RIS)"
    required: false
    default: ""
  - name: ENGRAM_MCP_URL
    description: "Endpoint MCP de Engram"
    required: false
    default: ""
  - name: DISCORD_BOT_TOKEN
    description: "Token del bot de Discord (Developer Portal, sección Bot). Solo si se usa Discord como canal"
    required: false
    default: ""
  - name: DISCORD_ALLOWED_USERS
    description: "IDs de usuario de Discord autorizados a hablar con el bot, separados por coma"
    required: false
    default: ""
